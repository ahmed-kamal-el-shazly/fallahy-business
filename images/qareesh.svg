<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="dairyBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F2F6F0"/>
      <stop offset="100%" stop-color="#D5DFD2"/>
    </radialGradient>
    <linearGradient id="reedMat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C29D5F"/>
      <stop offset="50%" stop-color="#DDB97F"/>
      <stop offset="100%" stop-color="#A88246"/>
    </linearGradient>
    <linearGradient id="cheeseGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F7FAF5"/>
      <stop offset="100%" stop-color="#E2EBE0"/>
    </linearGradient>
    <linearGradient id="cheeseGrad2" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FCFFFA"/>
      <stop offset="100%" stop-color="#DBE6D8"/>
    </linearGradient>
    <filter id="cheeseShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#2D402B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#dairyBg)"/>

  <!-- Traditional Egyptian Palm-Reed Strainer Mat (الحصيرة الفلاحي) -->
  <g opacity="0.6">
    <ellipse cx="200" cy="225" rx="165" ry="42" fill="#BFA069"/>
    <!-- Reed lines running across -->
    <path d="M 60 215 Q 200 240 340 215" stroke="#7A5A28" stroke-width="2.5" fill="none"/>
    <path d="M 50 223 Q 200 248 350 223" stroke="#9E793E" stroke-width="2.5" fill="none"/>
    <path d="M 65 231 Q 200 255 335 231" stroke="#6E5022" stroke-width="2" fill="none"/>
  </g>

  <!-- Left Cheese Block (قطعة جبنة قريش أفقية) -->
  <g filter="url(#cheeseShadow)" transform="rotate(-6 135 170)">
    <!-- Main 3D Cylinder / Block shape -->
    <path d="M 70 145 C 70 135, 170 135, 195 145 L 195 185 C 170 198, 70 198, 70 185 Z" fill="url(#cheeseGrad1)"/>
    <ellipse cx="132" cy="145" rx="62" ry="14" fill="#FFFFFF"/>
    
    <!-- Distinctive Palm-Reed Ridges (خطوط الحصيرة البارزة على القريش) -->
    <g stroke="#C6D6C2" stroke-width="2.5" opacity="0.85">
      <line x1="85" y1="148" x2="85" y2="187"/>
      <line x1="105" y1="152" x2="105" y2="191"/>
      <line x1="125" y1="154" x2="125" y2="193"/>
      <line x1="145" y1="153" x2="145" y2="192"/>
      <line x1="165" y1="150" x2="165" y2="189"/>
      <line x1="180" y1="146" x2="180" y2="185"/>
    </g>
    <!-- Texture indentations -->
    <g stroke="#ADC2A9" stroke-width="1" opacity="0.6" stroke-dasharray="2,3">
      <line x1="75" y1="160" x2="190" y2="160"/>
      <line x1="75" y1="175" x2="190" y2="175"/>
    </g>
  </g>

  <!-- Right Cheese Block (قطعة جبنة قريش أمامية مائلة) -->
  <g filter="url(#cheeseShadow)" transform="rotate(8 245 175)">
    <path d="M 180 150 C 180 140, 280 140, 305 150 L 305 190 C 280 203, 180 203, 180 190 Z" fill="url(#cheeseGrad2)"/>
    <ellipse cx="242" cy="150" rx="62" ry="14" fill="#FFFFFF"/>
    
    <!-- Reed Texture -->
    <g stroke="#C1D1BD" stroke-width="2.5" opacity="0.9">
      <line x1="195" y1="153" x2="195" y2="192"/>
      <line x1="215" y1="157" x2="215" y2="196"/>
      <line x1="235" y1="159" x2="235" y2="198"/>
      <line x1="255" y1="158" x2="255" y2="197"/>
      <line x1="275" y1="155" x2="275" y2="194"/>
      <line x1="292" y1="151" x2="292" y2="190"/>
    </g>
  </g>

  <!-- Fresh Olive Oil Drizzle & Mint Leaves Accent (لمسة زيت زيتون ونعناع فلاحي) -->
  <!-- Mint leaf -->
  <g fill="#43753B" stroke="#2D5426" stroke-width="1" filter="url(#cheeseShadow)">
    <path d="M 195 125 C 190 105, 215 100, 225 112 C 235 125, 210 135, 195 125 Z"/>
    <path d="M 195 125 Q 212 115 225 112" stroke="#689E5F" stroke-width="1.2" fill="none"/>
    
    <path d="M 180 132 C 165 118, 180 102, 195 115 C 205 125, 190 138, 180 132 Z"/>
    <path d="M 180 132 Q 188 120 195 115" stroke="#689E5F" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Drizzle of olive oil (قطرات زيت) -->
  <g fill="#B8A82A" opacity="0.75">
    <ellipse cx="140" cy="144" rx="14" ry="4"/>
    <ellipse cx="250" cy="148" rx="12" ry="3.5"/>
    <circle cx="215" cy="145" r="3"/>
  </g>
</svg>
