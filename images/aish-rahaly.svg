<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="rahalyBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F5E8D3"/>
      <stop offset="100%" stop-color="#DEC9A8"/>
    </radialGradient>
    <radialGradient id="breadBody" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#EED5A5"/>
      <stop offset="50%" stop-color="#D9B472"/>
      <stop offset="85%" stop-color="#B88A3C"/>
      <stop offset="100%" stop-color="#8C5E20"/>
    </radialGradient>
    <radialGradient id="breadBack" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#E3C48B"/>
      <stop offset="70%" stop-color="#B38137"/>
      <stop offset="100%" stop-color="#7B4E15"/>
    </radialGradient>
    <radialGradient id="spotGrad" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#542F0C"/>
      <stop offset="70%" stop-color="#3A1C05"/>
      <stop offset="100%" stop-color="#241002"/>
    </radialGradient>
    <filter id="breadShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5C3B14" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" fill="url(#rahalyBg)"/>
  
  <!-- Wooden Peel / Tray Hint -->
  <ellipse cx="200" cy="225" rx="170" ry="40" fill="#BA9A6E" opacity="0.35"/>
  <ellipse cx="200" cy="223" rx="160" ry="36" fill="#CBB089" opacity="0.4"/>

  <!-- Back Loaf (Aish Rahaly stacked) -->
  <g filter="url(#breadShadow)" opacity="0.9">
    <ellipse cx="180" cy="135" rx="115" ry="58" fill="url(#breadBack)" transform="rotate(-6 180 135)"/>
    <!-- Spots on back loaf -->
    <ellipse cx="140" cy="125" rx="7" ry="4" fill="url(#spotGrad)" opacity="0.75"/>
    <ellipse cx="175" cy="115" rx="11" ry="6" fill="url(#spotGrad)" opacity="0.8"/>
    <ellipse cx="215" cy="130" rx="9" ry="5" fill="url(#spotGrad)" opacity="0.7"/>
    <ellipse cx="190" cy="145" rx="6" ry="3.5" fill="url(#spotGrad)" opacity="0.7"/>
  </g>

  <!-- Front Loaf (Main thin, wide traditional Egyptian Rahaly) -->
  <g filter="url(#breadShadow)">
    <ellipse cx="205" cy="165" rx="125" ry="62" fill="url(#breadBody)" transform="rotate(2 205 165)"/>
    <!-- Flour dusting highlights -->
    <ellipse cx="175" cy="155" rx="65" ry="25" fill="#FFF3DB" opacity="0.35" transform="rotate(-3 175 155)"/>
    <ellipse cx="240" cy="170" rx="45" ry="18" fill="#FFF3DB" opacity="0.25"/>

    <!-- Distinctive baked blisters / spots from clay oven (فرن بلدي) -->
    <ellipse cx="155" cy="160" rx="12" ry="7" fill="url(#spotGrad)" opacity="0.85"/>
    <ellipse cx="195" cy="145" rx="16" ry="9" fill="url(#spotGrad)" opacity="0.85"/>
    <ellipse cx="245" cy="155" rx="13" ry="8" fill="url(#spotGrad)" opacity="0.85"/>
    <ellipse cx="215" cy="175" rx="18" ry="10" fill="url(#spotGrad)" opacity="0.9"/>
    <ellipse cx="170" cy="180" rx="10" ry="6" fill="url(#spotGrad)" opacity="0.8"/>
    <ellipse cx="270" cy="170" rx="8" ry="5" fill="url(#spotGrad)" opacity="0.75"/>
    <ellipse cx="130" cy="170" rx="9" ry="5" fill="url(#spotGrad)" opacity="0.75"/>

    <!-- Small char dots -->
    <circle cx="185" cy="165" r="3" fill="#291202" opacity="0.8"/>
    <circle cx="230" cy="140" r="2.5" fill="#291202" opacity="0.7"/>
    <circle cx="255" cy="180" r="3" fill="#291202" opacity="0.8"/>
    <circle cx="145" cy="145" r="2" fill="#291202" opacity="0.7"/>
  </g>

  <!-- Wheat Spike Accent -->
  <g stroke="#9C7334" stroke-width="2" stroke-linecap="round" opacity="0.45">
    <path d="M 60 250 Q 85 200 110 170"/>
    <ellipse cx="98" cy="185" rx="6" ry="3" fill="#C9A054" transform="rotate(-35 98 185)"/>
    <ellipse cx="108" cy="175" rx="6" ry="3" fill="#C9A054" transform="rotate(-40 108 175)"/>
    <ellipse cx="88" cy="198" rx="6" ry="3" fill="#C9A054" transform="rotate(-30 88 198)"/>
  </g>
</svg>
